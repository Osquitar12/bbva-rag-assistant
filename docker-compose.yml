# Levanta todo con:  docker compose up --build
#
#  qdrant  -> base de datos vectorial
#  ingest  -> scraping + indexación (se ejecuta una vez y termina; idempotente)
#  api     -> FastAPI en http://localhost:8000  (docs en /docs)
#  ui      -> Streamlit en http://localhost:8501
#  ollama  -> opcional, solo con:  docker compose --profile ollama up --build

x-app: &app
  build: .
  image: bbva-rag-assistant:latest
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_URL: http://qdrant:6333
    DATA_DIR: /app/data
    MODEL_CACHE_DIR: /app/.cache/models
  volumes:
    - ./data:/app/data            # datos crudos/limpios e historial quedan en tu máquina
    - models_cache:/app/.cache    # modelos de embeddings/reranker (se descargan una vez)

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  ingest:
    <<: *app
    command: ["python", "-m", "app.ingestion.run", "--all"]
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  ui:
    <<: *app
    command: ["streamlit", "run", "app/ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_data:
  models_cache:
  ollama_data:
